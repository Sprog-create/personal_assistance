<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal AI Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h2 {
      margin-bottom: 16px;
      font-size: 1.4rem;
      color: #a78bfa;
    }

    #chat-box {
      width: 700px;
      height: 500px;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 10px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .user {
      background: #7c3aed;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: #2a2a2a;
      color: #e2e2e2;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .thinking {
      color: #888;
      font-style: italic;
      font-size: 0.85rem;
      align-self: flex-start;
    }

    #input-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      width: 700px;
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #f0f0f0;
      font-size: 1rem;
      outline: none;
    }

    #user-input:focus {
      border-color: #7c3aed;
    }

    button {
      padding: 12px 22px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover { background: #6d28d9; }
    button:disabled { background: #444; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>🤖 Personal AI Assistant</h2>

  <div id="chat-box"></div>

  <div id="input-row">
    <input id="user-input" type="text" placeholder="Ask me anything..." />
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>           
    const API_URL = "https://personal-assistance-xour.onrender.com/chat";

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const btn = document.getElementById("send-btn");
      const text = input.value.trim();
      if (!text) return;

      // Show user message
      addMessage(text, "user");
      input.value = "";
      btn.disabled = true;

      // Show thinking indicator
      const thinking = addMessage("Thinking...", "thinking");

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
        });

        const data = await res.json();
        thinking.remove();
        addMessage(data.reply, "bot");
      } catch (err) {
        thinking.remove();
        addMessage("Error: Could not reach the server. Is it running?", "bot");
      }

      btn.disabled = false;
      input.focus();
    }

    function addMessage(text, type) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = `message ${type}`;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    // Send on Enter key
    document.getElementById("user-input")
      .addEventListener("keydown", e => {
        if (e.key === "Enter") sendMessage();
      });
  </script>

</body>
</html>
